name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Матрица держит macOS не из-за тарификации: это единственный прогон, который
# может подтвердить или опровергнуть «macOS is unverified» в README. Репозиторий
# публичный, Actions на стандартных GitHub-раннерах для публичных репозиториев
# бесплатны — лимит в 2000 Linux-минут на него не распространяется, и множители
# (Windows = 2×, macOS = 10×) относятся только к приватным.
jobs:
  build:
    name: build (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['22.19', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # npm is pinned rather than taken from whatever the Node release bundles.
      # npm below 11.21 does not block dependency install scripts, and it
      # synthesises `node-gyp rebuild` for any package that ships a binding.gyp
      # without an install script -- better-sqlite3 is exactly that case. The
      # rebuild needs MSVC, which the Windows runner does not have, and node-gyp
      # 11 cannot even recognise the Visual Studio 18 it finds there. Every native
      # dependency ships a prebuilt binary, so the blocked path is the real one.
      - run: npm install -g npm@^11.21.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  probe:
    name: probe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@^11.21.0
      - run: npm ci

      # Прямая проверка главного блокирующего вопроса: есть ли prebuild'ы
      # нативных модулей под эту платформу. Без MSVC.
      - name: Native modules load without a toolchain
        shell: bash
        run: node -e "require('better-sqlite3'); require('onnxruntime-node'); console.log('native ok')"

      - run: npm run build
      - name: Environment probe
        # Лог перенаправляется в файл: артефакт ниже должен содержать вывод
        # целиком, иначе в интерфейсе GitHub остаётся только последняя строка.
        run: node dist/probe.js 2>&1 | tee probe-${{ matrix.os }}.log

      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-${{ matrix.os }}
          path: probe-*.log
          if-no-files-found: ignore

  native-fallback:
    name: native build from source (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g npm@^11.21.0
      - name: Fallback path when prebuilds are unavailable
        run: |
          npm ci
          npx --yes npm-install-scripts approve onnxruntime-node || true
          npm rebuild better-sqlite3 || true
      - run: npm run build
      - run: npm test